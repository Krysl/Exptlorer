[package]
name = "rust_lib_exptlorer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
sysinfo = "0.39.3"
